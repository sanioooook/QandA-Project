name: qanda

x-db-credentials: &db-credentials
  POSTGRES_USER: ${POSTGRES_USER:-qanda}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qanda}
  POSTGRES_DB: ${POSTGRES_DB:-qanda}

services:
  db:
    image: postgres:16
    environment: *db-credentials
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./Server
      target: final
    environment:
      ConnectionStrings__Default: Host=db;Database=${POSTGRES_DB:-qanda};Username=${POSTGRES_USER:-qanda};Password=${POSTGRES_PASSWORD:-qanda}
    volumes:
      - api-keys:/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q Healthy <&3'"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Production build of the SPA served by nginx, which also proxies /api to the API.
  web:
    build:
      context: ./Frontend
      target: final
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # Vite dev server with hot reload: `docker compose --profile dev up web-dev`.
  # node_modules lives in a named volume, not on the host disk.
  web-dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:8080
    volumes:
      - ./Frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

  api-tests:
    profiles: [test]
    build:
      context: ./Server
      target: test
    environment:
      TEST_DB_CONNECTION: Host=db;Username=${POSTGRES_USER:-qanda};Password=${POSTGRES_PASSWORD:-qanda}
    depends_on:
      db:
        condition: service_healthy

  web-tests:
    profiles: [test]
    build:
      context: ./Frontend
      target: test

volumes:
  db-data:
  api-keys:
  web-node-modules:
